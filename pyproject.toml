[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "horo-memory"
version = "0.1.0"
description = "Self-hosted operational memory and observable learning layer for AI agents"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "HORO" }]
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "mcp>=1.13,<2",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]
graphify = ["graphifyy>=0.9.65,<1"]

[project.scripts]
horo-memory = "horo_memory.cli:main"
horo-memory-mcp = "horo_memory.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/horo_memory"]

[tool.hatch.build.targets.wheel.force-include]
"static" = "horo_memory/static"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
